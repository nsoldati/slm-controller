[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slm-controller"
version = "0.2.0"
description = "Research code for modelling and control of a selective laser melting process"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Nathan Soldati" }]
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "torch>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
slm-single-layer = "slm_control.cli:single_layer"
slm-multilayer = "slm_control.cli:multilayer"
slm-plot-trajectory = "slm_control.cli:plot_trajectory_command"
slm-train = "slm_control.cli:train_controller_command"
slm-evaluate = "slm_control.cli:evaluate_controller_command"

[tool.hatch.build.targets.wheel]
packages = ["src/slm_control"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
